[package]
name = "mistria-together"
version = "0.1.0"
edition = "2021"
description = "Companion program for the Mistria Together co-op mod: networking, session hub and the file bridge to the game"
license = "GPL-3.0-or-later"
repository = "https://github.com/RobertFrank06/mistria-together"

[lib]
name = "mistria_together"
path = "src/lib.rs"

[[bin]]
name = "mistria-together"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }

[dev-dependencies]
tempfile = "3"
