name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  gml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/lint-gml.py

  gml-compile:
    # MOMI's own GML checker ships inside its CLI bundle, which extracts it on
    # first run (verified with a clean HOME: it lands under ~/.net and
    # tools/check-gml.sh finds it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.17.0 --repo Garethp/Mods-of-Mistria-Installer \
            --pattern ModsOfMistriaInstaller-cli-linux --dir "$RUNNER_TEMP/momi"
          chmod +x "$RUNNER_TEMP/momi/ModsOfMistriaInstaller-cli-linux"
          "$RUNNER_TEMP/momi/ModsOfMistriaInstaller-cli-linux" --version || true
          tools/check-gml.sh
