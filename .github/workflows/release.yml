name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bin: mistria-together
          - os: windows-latest
            name: windows
            bin: mistria-together.exe
          - os: macos-latest
            name: macos
            bin: mistria-together
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/MistriaTogether
          tools/package-mod.sh dist/MistriaTogether
          cp "target/release/${{ matrix.bin }}" LICENSE packaging/READ-ME-FIRST.txt dist/MistriaTogether/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp ../packaging/Install.bat MistriaTogether/
            7z a "../MistriaTogether-${{ matrix.name }}.zip" MistriaTogether > /dev/null
          else
            cp ../packaging/install.sh MistriaTogether/
            tar czf "../MistriaTogether-${{ matrix.name }}.tar.gz" MistriaTogether
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: companion-${{ matrix.name }}
          path: MistriaTogether-${{ matrix.name }}.*

  release:
    needs: companion
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Mistria Together $GITHUB_REF_NAME" --generate-notes
